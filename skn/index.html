h4.sec{margin:24px 0 12px;font-size:14px;display:flex;align-items:center;gap:9px}

<script>
const W=(n)=>n.toLocaleString('ko-KR');
const 억=(n)=>(n/100000000).toFixed(n>=1000000000?1:2)+'억';

const DONG=['메가동','제넥스센터동','테크노동','리서치동'];
const UPJONG=['전자부품','정밀기계','금형·사출','소프트웨어','반도체장비','자동차부품','의료기기','광학기기','화장품 제조','물류·유통','디스플레이','전기제어'];

let _s=20260728;
const R=()=>{_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff;};
const pick=a=>a[Math.floor(R()*a.length)];
const ri=(a,b)=>Math.floor(R()*(b-a+1))+a;

const HOSIL=[],COMPANY=[];
(function(){
  let hid=0, cid=0;
  for(let d=0;d<4;d++){
    const cnt=[210,190,160,140][d];
    for(let i=0;i<cnt;i++){
      hid++;
      const fl=Math.floor(i/26)+1;
      HOSIL.push({id:hid,dong:DONG[d],ho:fl+String(101+(i%26)).slice(1)+'호',floor:fl,
        area:[35,48,61,80,103,140,179][ri(0,6)], own:R()<0.46?'자가':'임차', cid:null});
    }
  }
  const vac=new Set(); while(vac.size<6) vac.add(ri(0,HOSIL.length-1));
  const free=HOSIL.map((h,i)=>i).filter(i=>!vac.has(i));
  let p=0;
  while(p<free.length && COMPANY.length<453){
    cid++;
    const u=ri(0,11);
    const c={id:cid,name:pick(PRE)+pick(SUF),up:UPJONG[u],pum:PUM[u],
      ceo:'대표 '+pick(['김','이','박','최','정','강','조','윤','장','임'])+'○○',
      emp:ri(3,85),rooms:[],area:0};
    const take=Math.min(R()<0.72?1:(R()<0.7?2:3), free.length-p, COMPANY.length===452?99:3);
    for(let k=0;k<take;k++){const h=HOSIL[free[p++]];h.cid=cid;c.rooms.push(h.ho);c.area+=h.area;}
    COMPANY.push(c);
  }
  while(p<free.length){const h=HOSIL[free[p++]];const c=COMPANY[ri(0,COMPANY.length-1)];h.cid=c.id;c.rooms.push(h.ho);c.area+=h.area;}
})();

  {id:'dash',t:'경영 대시보드',c:'2026년 7월 · 관리단',g:'경영'},

const nav=document.getElementById('nav');
let lastG='';
PAGES.forEach(p=>{
  if(p.g!==lastG){lastG=p.g;const h=document.createElement('div');h.className='navgrp';h.textContent=p.g;nav.appendChild(h);}
  const b=document.createElement('button');
  b.className='nav';b.dataset.id=p.id;
  b.innerHTML=`<span class="n">${String(PAGES.indexOf(p)+1).padStart(2,'0')}</span><span>${p.t}</span>`;
  b.onclick=()=>go(p.id);
  nav.appendChild(b);
});
function go(id){
  const p=PAGES.find(x=>x.id===id);
  document.getElementById('ttl').textContent=p.t;
  document.getElementById('crumb').textContent=p.c;
  document.getElementById('view').innerHTML=V[id]();
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.id===id));
  window.scrollTo({top:0,behavior:'instant'});
}
go('dash');
